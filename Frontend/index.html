<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>拾光手记</title>
    <meta name="description" content="极简现代的云端灵感随笔与日记空间，记录思维火花、日常随感与心境沉淀。" />
    <meta name="author" content="拾光手记" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- iOS Safari 添加到主屏幕 (Add to Home Screen) Meta 规范 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="拾光手记" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#5B7B8D" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var s = localStorage.getItem("diary_wallpaper_settings_v3");
          var cfg = s ? JSON.parse(s) : null;
          if (cfg && cfg.enabled === false) return;
          if (cfg && cfg.selectedWallpaperUrl && !cfg.selectedWallpaperUrl.includes("bing")) return;
          var c = localStorage.getItem("diary_bing_wallpaper_base64_v1");
          if (c) {
            var rec = JSON.parse(c);
            if (rec && rec.base64) {
              var el = document.createElement("div");
              el.id = "app-pre-wallpaper";
              var blur = (cfg && typeof cfg.blur === "number") ? cfg.blur : 12;
              el.style.cssText = "position:fixed;top:-24px;left:-24px;right:-24px;bottom:-24px;z-index:0;pointer-events:none;background-image:url('" + rec.base64 + "');background-size:cover;background-position:center;filter:blur(" + blur + "px);transform:scale(1.06);";
              document.documentElement.appendChild(el);
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
